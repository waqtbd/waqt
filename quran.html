<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>পবিত্র কুরআন — Waqt (ওয়াক্ত)</title>
<meta name="description" content="Waqt (ওয়াক্ত) — পবিত্র কুরআন: আসল মুসহাফের ৬০৪ পাতা, আরবি লেখা, মুহিউদ্দীন খানের বাংলা অর্থ ও মিশারি আল-আফাসির তিলাওয়াত। পাতা উল্টে পড়ুন, শুনুন।">
<meta name="theme-color" content="#0b5c4d">
<link rel="icon" type="image/png" href="logo.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --emerald:#0b5c4d; --emerald-deep:#073f34; --gold:#c9a227; --gold-soft:#e7cf7a;
  --paper:#fffdf4; --paper2:#faf2da; --ink:#22302a; --muted:#6b7a72;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Hind Siliguri',sans-serif;background:#0a3d31;color:var(--ink);overflow-x:hidden;
  background-image:radial-gradient(ellipse at 50% -10%,#11634f 0%,#0a3d31 55%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:10px 12px;background:linear-gradient(180deg,rgba(7,50,40,.97),rgba(7,50,40,.92));
  backdrop-filter:blur(6px);border-bottom:1px solid rgba(201,162,39,.35)}
header .back{display:flex;align-items:center;gap:6px;color:#eafaf3;font-size:15px;font-weight:600;
  padding:9px 12px;border:1px solid rgba(231,207,122,.45);border-radius:999px;min-height:44px;text-decoration:none}
header .ttl{flex:1;text-align:center;color:#fff}
header .ttl b{display:block;font-size:19px;line-height:1.15}
header .ttl span{font-size:12px;color:var(--gold-soft)}
header .idxbtn{color:#073f34;background:linear-gradient(180deg,var(--gold-soft),var(--gold));
  font-weight:700;font-size:14px;padding:10px 14px;border-radius:999px;min-height:44px}
main{max-width:760px;margin:0 auto;padding:12px 10px 8px}
#book{position:relative;height:calc(100dvh - 252px);min-height:340px;perspective:1900px;overflow:hidden;border-radius:8px}
.page,.sheet{position:absolute;inset:0;border-radius:8px}
.page{background:linear-gradient(160deg,var(--paper) 0%,var(--paper2) 100%);
  border:1px solid #d9c68d;box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 0 60px rgba(160,118,18,.15);
  overflow:hidden}
.page::before{content:"";position:absolute;inset:7px;border:1.5px solid rgba(201,162,39,.55);
  border-radius:5px;pointer-events:none;z-index:3}
.page::after{content:"";position:absolute;inset:11px;border:.75px solid rgba(201,162,39,.35);
  border-radius:4px;pointer-events:none;z-index:3}
.page-scroll{position:absolute;inset:14px;overflow-y:auto;padding:20px 16px 22px;scrollbar-width:thin;
  border-radius:7px;display:flex;flex-direction:column;
  background:linear-gradient(172deg,#fffef9 0%,#fdf6e1 52%,#f8ecc9 100%);
  box-shadow:inset 0 0 34px rgba(201,162,39,.13),inset 0 1px 0 rgba(255,255,255,.75)}
.page-inner{margin:auto 0}
.sheet{z-index:6;pointer-events:none;display:none}
.curl-rest{position:absolute;inset:0;border-radius:8px;overflow:hidden;
  background:linear-gradient(160deg,var(--paper),var(--paper2));border:1px solid #d9c68d;
  box-shadow:inset 0 0 60px rgba(160,118,18,.15)}
.curl-rest::before{content:"";position:absolute;inset:7px;border:1.5px solid rgba(201,162,39,.55);border-radius:5px;pointer-events:none;z-index:3}
.curl-rest::after{content:"";position:absolute;inset:11px;border:.75px solid rgba(201,162,39,.35);border-radius:4px;pointer-events:none;z-index:3}
.curl-shadow{position:absolute;left:0;top:0;width:76px;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,rgba(60,45,10,0),rgba(60,45,10,.30),rgba(60,45,10,0))}
.curl-flap{position:absolute;inset:0;transform-origin:0 0;pointer-events:none}
.curl-flap-in{position:absolute;inset:0;border-radius:8px;overflow:hidden;border:1px solid #d9c68d;
  background:linear-gradient(70deg,#f8efdb,#eee0ba)}
.curl-flap-in::before{content:"";position:absolute;inset:7px;border:1.5px solid rgba(201,162,39,.5);border-radius:5px;pointer-events:none}
.curl-flap-in::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,rgba(120,90,20,.28),rgba(255,255,255,.14) 55%,rgba(120,90,20,.32));opacity:var(--fsh,.4)}
.curl-flap-in .page-scroll{opacity:.48}
#loading{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;
  color:var(--emerald);font-weight:600;font-size:16px;background:rgba(255,253,244,.85);border-radius:8px}
.ar-block{direction:rtl;text-align:justify;font-family:'Amiri Quran',serif;
  font-size:var(--arfs,27px);line-height:var(--arlh,2.08);color:#1c2a24}
.ar-block .ayah{border-radius:6px;padding:0 1px}
.ar-block .ayah.playing{background:rgba(201,162,39,.28);box-shadow:0 0 0 2px rgba(201,162,39,.25)}
body.meaning .ar-block .ayah{cursor:pointer}
.marker{display:inline-flex;align-items:center;justify-content:center;vertical-align:-.12em;line-height:1;color:#f0d98c;background:#0b5c4d;border:1px solid #c9a227;border-radius:999px;font-size:.6em;font-weight:700;white-space:nowrap;padding:.3em .34em .36em;margin:0 .1em}
.surah-head{margin:6px 0 10px;padding:16px 12px 13px;border-radius:8px;text-align:center;
  background:linear-gradient(180deg,#0e6a55,#0b5c4d);border:1px solid var(--gold);
  box-shadow:inset 0 0 0 3px rgba(231,207,122,.25)}
.surah-head .sh-ar{display:block;font-family:'Amiri Quran',serif;font-size:calc(var(--arfs,27px)*1.32);font-weight:700;text-shadow:0 0 2px rgba(243,217,139,.55);color:#f3d98b;line-height:2.0;margin-bottom:6px}
.surah-head .sh-meta{display:block;font-size:12px;color:#cfe9db;margin-top:1px}
.bismillah{direction:rtl;text-align:center;font-family:'Amiri Quran',serif;
  font-size:calc(var(--arfs,27px)*.96);line-height:1.9;color:#0b5c4d;margin:2px 0 8px}
.page-foot{margin-top:14px;padding-top:8px;border-top:1px solid rgba(201,162,39,.4);
  display:flex;justify-content:space-between;align-items:center;color:#8a6d1f;font-size:13px;font-weight:600}
.page-foot .wm{letter-spacing:.14em;font-size:11px;color:#b08d28}
#meta{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;color:#eafaf3;font-size:14.5px}
#meta .pgnum{font-weight:700;color:#fff;cursor:pointer;padding:6px 10px;border-radius:8px;border:1px dashed rgba(231,207,122,.5)}
#hint{display:none;text-align:center;color:#ffe9a8;font-size:13.5px;margin-top:6px}
#playStatus{display:none;text-align:center;color:var(--gold-soft);font-size:13.5px;margin-top:6px;min-height:18px}
#controls{position:sticky;bottom:0;z-index:30;max-width:760px;margin:8px auto 0;
  display:flex;gap:8px;padding:10px;background:linear-gradient(180deg,rgba(7,50,40,.92),rgba(7,50,40,.98));
  border-top:1px solid rgba(201,162,39,.35);backdrop-filter:blur(6px)}
#controls button{flex:1;min-height:50px;border-radius:12px;font-size:15.5px;font-weight:700;
  color:#eafaf3;border:1px solid rgba(231,207,122,.4);background:rgba(255,255,255,.06)}
#controls button:active{transform:scale(.97)}
#controls #playBtn{background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:#3a2c00;border:none}
#controls #bnBtn.on{background:#11634f;border-color:var(--gold-soft);color:#fff}
#meaningCard{position:fixed;left:50%;bottom:84px;z-index:40;visibility:hidden;pointer-events:none;
  transform:translate(-50%,calc(100% + 96px));
  width:min(720px,calc(100vw - 20px));background:var(--paper);border:1.5px solid var(--gold);border-radius:16px;
  box-shadow:0 16px 44px rgba(0,0,0,.5);padding:14px 16px 12px;
  transition:transform .3s ease,visibility 0s linear .3s}
#meaningCard.open{transform:translate(-50%,0);visibility:visible;pointer-events:auto;
  transition:transform .3s ease,visibility 0s}
#meaningCard .mc-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#meaningCard .mc-head b{flex:1;color:var(--emerald);font-size:15px}
#meaningCard .mc-head .x{font-size:17px;padding:6px 11px;border-radius:9px;background:#f1e8c8;min-height:40px;min-width:40px}
#meaningCard .mc-bn{display:block;font-size:16.5px;line-height:1.8;color:#2c3a33}
#meaningCard .mc-en{display:block;font-size:13.5px;line-height:1.65;color:var(--muted);margin-top:3px}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(4,30,24,.72);display:none;
  align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet-panel{background:var(--paper);width:100%;max-width:760px;max-height:86dvh;border-radius:18px 18px 0 0;
  display:flex;flex-direction:column;overflow:hidden;animation:up .25s ease}
@keyframes up{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
.sheet-panel .p-head{padding:14px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #eadfae}
.sheet-panel .p-head b{flex:1;font-size:17px;color:var(--emerald)}
.sheet-panel .p-head .x{font-size:20px;padding:8px 12px;border-radius:10px;background:#f1e8c8;min-height:44px;min-width:44px}
.sheet-panel .p-search{padding:10px 16px;border-bottom:1px solid #f0e6bd}
.sheet-panel .p-search input{width:100%;padding:12px 14px;font-size:16px;font-family:inherit;
  border:1.5px solid #d9c68d;border-radius:12px;background:#fffef9}
.surah-list{overflow-y:auto;padding:6px 8px 14px}
.surah-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 10px;
  border-radius:12px;min-height:56px}
.surah-row:active{background:#f4ecd0}
.surah-row .no{width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--gold);border-radius:50%;color:#8a6d1f;font-weight:700;font-size:14px;background:#fffbe9}
.surah-row .nm{flex:1}
.surah-row .nm b{display:block;font-size:16px;color:#22302a}
.surah-row .nm span{font-size:12.5px;color:var(--muted)}
.surah-row .arnm{font-family:'Amiri Quran',serif;font-size:21px;color:var(--emerald)}
.jump-body{padding:18px 16px 22px;text-align:center}
.jump-body input{width:130px;padding:12px;font-size:20px;text-align:center;font-family:inherit;
  border:1.5px solid #d9c68d;border-radius:12px;background:#fffef9}
.jump-body .go{margin-left:8px;padding:12px 22px;font-size:16px;font-weight:700;border-radius:12px;
  background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:#3a2c00;min-height:50px}
.jump-body p{color:var(--muted);font-size:13.5px;margin-top:10px}
@media (min-width:640px){ #book{height:calc(100dvh - 260px)} }
</style>
</head>
<body>
<header>
  <a class="back" href="index.html">‹ Waqt হোম</a>
  <div class="ttl"><b>পবিত্র কুরআন</b><span>আল-কুরআনুল কারীম · মুসহাফ</span></div>
  <button class="idxbtn" id="openIndex">সূরা তালিকা</button>
</header>
<main>
  <div id="book">
    <div class="page" id="pageBase"><div class="page-scroll" id="pageScroll"></div></div>
    <div class="sheet" id="sheet"><div class="curl-rest" id="curlRest"></div><div class="curl-shadow" id="curlShadow"></div><div class="curl-flap" id="curlFlap"><div class="curl-flap-in" id="curlFlapIn"></div></div></div>
    <div id="loading">পৃষ্ঠা আনা হচ্ছে…</div>
  </div>
  <div id="meta"><span>পৃষ্ঠা</span><span class="pgnum" id="pgNum">১</span><span>/ ৬০৪</span><span id="juzLbl"></span></div>
  <div id="hint">অর্থ চালু আছে — যেকোনো আয়াতে tap করলে তার অর্থ দেখাবে</div>

</main>
<div id="controls">
  <button id="prevBtn">‹ আগের পাতা</button>

  <button id="nextBtn">পরের পাতা ›</button>
</div>

<div id="meaningCard">
  <div class="mc-head"><b id="mcTitle"></b><button class="x" id="mcClose">✕</button></div>
  <span class="mc-bn" id="mcBn"></span>
  <span class="mc-en" id="mcEn"></span>
</div>

<div class="overlay" id="indexOverlay">
  <div class="sheet-panel">
    <div class="p-head"><b>সূরার তালিকা</b><button class="x" data-close="indexOverlay">✕</button></div>
    <div class="p-search"><input id="surahSearch" type="text" placeholder="সূরার নাম বা নম্বর লিখুন — যেমন: Yaseen, 36"></div>
    <div class="surah-list" id="surahList"></div>
  </div>
</div>

<div class="overlay" id="jumpOverlay">
  <div class="sheet-panel">
    <div class="p-head"><b>পৃষ্ঠায় যান</b><button class="x" data-close="jumpOverlay">✕</button></div>
    <div class="jump-body">
      <input id="jumpInput" type="number" min="1" max="604" inputmode="numeric" placeholder="1–604">
      <button class="go" id="jumpGo">যান</button>
      <p>মুসহাফের পৃষ্ঠা নম্বর দিন (১ থেকে ৬০৪)</p>
    </div>
  </div>
</div>

<audio id="player" preload="auto"></audio>

<script>
"use strict";
const TOTAL = 604, PACK = 20, ANIM_MS = 1150;
const bnD = s => String(s).replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]);
const arD = s => String(s).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const $ = id => document.getElementById(id);
let INDEX = null, BISM = "";
const packs = {};               // packNo -> {pages:{...}}
const fitCache = {};            // page -> [fitted arabic font size, line-height]
let cur = 1;                    // current page
let curAyahs = [];              // ayahs of the current page (for meaning lookup)
let meaningMode = localStorage.getItem("waqtQuranBn") === "1";
let flipping = false;

/* ---------- data ---------- */
async function loadPack(k){
  if (packs[k]) return packs[k];
  const r = await fetch("quran/pack" + String(k).padStart(2,"0") + ".json");
  if (!r.ok) throw new Error("pack " + k + " HTTP " + r.status);
  packs[k] = await r.json();
  return packs[k];
}
const packOf = page => Math.floor((page - 1) / PACK);
async function pageAyahs(page){
  const p = await loadPack(packOf(page));
  return p.pages[String(page)] || [];
}
function surahMeta(n){ return INDEX.surahs[n - 1]; }

/* ---------- auto-fit: largest font size that fits the page without scrolling ---------- */
const FIT_SIZES = [24, 22.5, 21, 19.5, 18, 16.5, 15, 13.5, 12.5];
/* Fit = largest font whose lines can SPREAD to fill the page: for each size, the
   line-height that exactly fills the panel is solved from two measurements and
   clamped to 2.02..2.8 — so pages are neither cramped nor floating in dead space. */
function fitScroll(el, page){
  const apply = (sz, lh) => {
    el.style.setProperty("--arfs", sz + "px");
    el.style.setProperty("--arlh", String(lh));
  };
  if (fitCache[page]){ const c = fitCache[page]; apply(c[0], c[1]); el.style.overflowY = "hidden"; return c[0]; }
  if (el.clientHeight < 50){ apply(19.5, 2.35); return 19.5; }   // hidden element: do not measure, do not cache
  const avail = el.clientHeight - 48;   // panel vertical padding (42px) + breathing room
  const target = avail - 6;
  const lastSz = FIT_SIZES[FIT_SIZES.length - 1];
  /* measure the CONTENT wrapper, never the scroll box: with the text vertically
     centered, the scroll box always reports full height and fools the fit */
  const inner = el.querySelector ? el.querySelector(".page-inner") : null;
  const measure = () => inner ? inner.offsetHeight : el.scrollHeight;
  let chosen = null;
  for (const sz of FIT_SIZES){
    apply(sz, 2.02);
    const h1 = measure();
    if (h1 > target && sz === lastSz){ chosen = [sz, 2.02]; break; }
    apply(sz, 2.5);
    const h2 = measure();
    const slope = (h2 - h1) / 0.48;
    if (slope < 1){ if (h1 <= target){ chosen = [sz, 2.35]; break; } continue; }
    const fixed = h1 - slope * 2.02;
    const lhNeed = (target - fixed) / slope;
    if (lhNeed < 2.02) continue;
    let lh = Math.min(lhNeed, 2.8);
    apply(sz, lh);
    let guard = 0;
    while (measure() > avail && lh > 2.03 && guard++ < 4){ lh = Math.max(2.02, lh - 0.08); apply(sz, lh); }
    chosen = [sz, Math.round(lh * 100) / 100];
    break;
  }
  if (!chosen) chosen = [lastSz, 2.02];
  fitCache[page] = chosen;
  el.style.overflowY = (measure() <= avail) ? "hidden" : "auto";
  return chosen[0];
}

/* ---------- rendering ---------- */
function pageHTML(ayahs, pageNo){
  let ar = "", lastSurah = 0;
  for (const a of ayahs){
    if (a.a === 1 && a.s !== lastSurah){
      const m = surahMeta(a.s);
      ar += `</p><div class="surah-head"><span class="sh-ar">${m.ar}</span>` +
            `<span class="sh-meta">সূরা ${bnD(m.n)} · ${bnD(m.ayahs)} আয়াত · ${m.type === "Meccan" ? "মক্কী" : "মাদানী"}</span></div>`;
      if (m.bism && a.s !== 1) ar += `<div class="bismillah">${BISM}</div>`;
      ar += `<p class="ar-block">`;
      lastSurah = a.s;
    }
    ar += `<span class="ayah" data-s="${a.s}" data-a="${a.a}">${a.ar}<span class="marker">۝${arD(a.a)}</span></span> `;
  }
  let html = `<p class="ar-block">${ar}</p>`;
  html = html.replace('<p class="ar-block"></p>', '');
  const juz = ayahs.length ? ayahs[0].j : "";
  html += `<div class="page-foot"><span>পারা ${bnD(juz)}</span><span class="wm">WAQT</span><span>পৃষ্ঠা ${bnD(pageNo)}</span></div>`;
  return html;
}
function setBase(ayahs, page){
  curAyahs = ayahs;
  const sc = $("pageScroll");
  sc.innerHTML = `<div class="page-inner">${pageHTML(ayahs, page)}</div>`;
  sc.scrollTop = 0;
  fitScroll(sc, page);
  $("pgNum").textContent = bnD(page);
  $("juzLbl").textContent = ayahs.length ? "· পারা " + bnD(ayahs[0].j) : "";
  localStorage.setItem("waqtQuranPage", String(page));
}
async function render(page){
  setBase(await pageAyahs(page), page);
}

/* ---------- page flip: true corner-curl, After-Effects page-turn style ----------
   The turning sheet (always the current page) is drawn in two pieces around a
   moving fold line: the part still flat on the book (rest, clipped) and the
   folded-over corner (flap, clipped to the corner region and reflected across
   the fold line) — through the flap the incoming page's text ghosts like light
   through thin paper. Next curls from the bottom-right corner; prev is the
   exact mirror, curling from the bottom-left corner. */
async function flipTo(target, dir){
  let guard = 0;
  while (flipping && guard++ < 15) await new Promise(r => setTimeout(r, 60));
  if (flipping || target === cur || target < 1 || target > TOTAL) return;
  flipping = true;
  const need = packOf(target);
  if (!packs[need]){ $("loading").style.display = "flex"; await loadPack(need).catch(()=>{}); $("loading").style.display = "none"; }
  const tAyahs = await pageAyahs(target);
  const cAyahs = curAyahs;
  const book = $("book"), W = book.clientWidth, H = book.clientHeight;
  const fromPage = cur;
  cur = target;
  $("pgNum").textContent = bnD(target);
  localStorage.setItem("waqtQuranPage", String(target));
  const nk = packOf(target + (dir > 0 ? 1 : -1));
  if (nk >= 0 && nk <= 30 && !packs[nk]) loadPack(nk).catch(()=>{});
  if (!W || !H){ setBase(tAyahs, target); flipping = false; return; }
  const rest = $("curlRest"), flap = $("curlFlap"), flapIn = $("curlFlapIn"), shadow = $("curlShadow");
  $("sheet").style.display = "block";   // must be visible before its layers are measured
  rest.innerHTML = `<div class="page-scroll"><div class="page-inner">${pageHTML(cAyahs, fromPage)}</div></div>`;
  const rEl = rest.querySelector(".page-scroll"); if (rEl) fitScroll(rEl, fromPage);
  flapIn.innerHTML = `<div class="page-scroll"><div class="page-inner">${pageHTML(tAyahs, target)}</div></div>`;
  const fEl = flapIn.querySelector(".page-scroll"); if (fEl) fitScroll(fEl, target);
  setBase(tAyahs, target);
  shadow.style.height = Math.round(H * 1.7) + "px";
  flipSound();
  /* fold geometry: corner C is dragged to D as progress s goes 0→1;
     the fold line is the perpendicular bisector of C→D */
  const mirror = dir < 0, Cx = mirror ? 0 : W;
  function clipHalf(poly, Mx, My, nx, ny, sign){
    const out = [];
    for (let i = 0; i < poly.length; i++){
      const a = poly[i], b = poly[(i + 1) % poly.length];
      const da = ((a[0] - Mx) * nx + (a[1] - My) * ny) * sign;
      const db = ((b[0] - Mx) * nx + (b[1] - My) * ny) * sign;
      if (da >= 0) out.push(a);
      if ((da >= 0) !== (db >= 0)){
        const k = da / (da - db);
        out.push([a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]);
      }
    }
    return out;
  }
  const polyStr = poly => poly.length >= 3
    ? `polygon(${poly.map(p => p[0].toFixed(1) + "px " + p[1].toFixed(1) + "px").join(",")})`
    : "polygon(0px 0px,0px 0px,0px 0px)";
  function drawCurl(sRaw){
    const s = Math.min(Math.max(sRaw, 0.004), 0.999);
    const Dx = mirror ? 2.3 * W * s : W - 2.3 * W * s;
    const Dy = H - 0.16 * H * Math.sin(Math.PI * s);
    const Mx = (Cx + Dx) / 2, My = (H + Dy) / 2;
    let vx = Dx - Cx, vy = Dy - H;
    const vl = Math.hypot(vx, vy) || 1; vx /= vl; vy /= vl;
    const ux = -vy, uy = vx;
    const rect = [[0, 0], [W, 0], [W, H], [0, H]];
    rest.style.clipPath = polyStr(clipHalf(rect, Mx, My, vx, vy, 1));
    flapIn.style.clipPath = polyStr(clipHalf(rect, Mx, My, vx, vy, -1));
    const R11 = 2 * ux * ux - 1, R12 = 2 * ux * uy, R22 = 2 * uy * uy - 1;
    const e = Mx - (R11 * Mx + R12 * My), f = My - (R12 * Mx + R22 * My);
    flap.style.transform = `matrix(${R11.toFixed(4)},${R12.toFixed(4)},${R12.toFixed(4)},${R22.toFixed(4)},${e.toFixed(1)},${f.toFixed(1)})`;
    flap.style.setProperty("--fsh", (0.25 + 0.55 * Math.sin(Math.PI * Math.min(s * 1.15, 1))).toFixed(3));
    const ang = Math.atan2(uy, ux) * 180 / Math.PI - 90;
    shadow.style.transform = `translate(${Mx.toFixed(1)}px,${My.toFixed(1)}px) translate(-50%,-50%) rotate(${ang.toFixed(1)}deg)`;
    shadow.style.opacity = (0.9 * Math.sin(Math.PI * Math.min(s * 1.1, 1))).toFixed(3);
  }
  const DUR = 1100, t0 = performance.now();
  const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  function frame(now){
    const t = Math.min((now - t0) / DUR, 1);
    drawCurl(ease(t));
    if (t < 1) requestAnimationFrame(frame);
    else { $("sheet").style.display = "none"; flipping = false; }
  }
  drawCurl(0);
  requestAnimationFrame(frame);
}
/* ---------- page-flip sound (Sunny's own pick: Freesound book-page recording, page-flip.mp3) ---------- */
let flipAudio = null;
function flipSound(){
  try{
    if (!flipAudio){ flipAudio = new Audio("page-flip.mp3"); flipAudio.preload = "auto"; }
    flipAudio.currentTime = 0;
    const p = flipAudio.play(); if (p && p.catch) p.catch(()=>{});
  }catch(e){}
}
const nextPage = () => flipTo(cur + 1, 1);
const prevPage = () => flipTo(cur - 1, -1);

/* touch + taps follow the side touched: right side = next page, left side = previous page */
let tx = 0, ty = 0;
$("book").addEventListener("touchstart", e => { const t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; }, {passive:true});
$("book").addEventListener("touchend", e => {
  const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4){ dx > 0 ? prevPage() : nextPage(); }
}, {passive:true});
$("book").addEventListener("click", e => {
  if (window.getSelection && String(window.getSelection())) return;
  const r = $("book").getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
  if (meaningMode){
    const ay = e.target.closest ? e.target.closest(".ayah") : null;
    if (ay && x > 0.10 && x < 0.90){ showMeaning(Number(ay.dataset.s), Number(ay.dataset.a)); return; }
  }
  if (x < 0.16) prevPage(); else if (x > 0.84) nextPage();
});
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") prevPage();
  if (e.key === "ArrowRight") nextPage();
});
$("nextBtn").addEventListener("click", nextPage);
$("prevBtn").addEventListener("click", prevPage);

/* ---------- meaning mode: tap an ayah, see its meaning in a card ---------- */
function showMeaning(s, a){
  const ay = curAyahs.find(x => x.s === s && x.a === a);
  if (!ay) return;
  const m = surahMeta(s);
  $("mcTitle").textContent = `সূরা ${m.en} · আয়াত ${bnD(a)}`;
  $("mcBn").textContent = ay.bn;
  $("mcEn").textContent = ay.en;
  $("meaningCard").classList.add("open");
}
$("mcClose").addEventListener("click", () => $("meaningCard").classList.remove("open"));
function syncMeaningUI(){
  document.body.classList.toggle("meaning", meaningMode);
  $("bnBtn").classList.toggle("on", meaningMode);
  $("bnBtn").textContent = meaningMode ? "অর্থ ✓" : "অর্থ";
  $("hint").style.display = meaningMode ? "block" : "none";
  if (!meaningMode) $("meaningCard").classList.remove("open");
}
$("bnBtn").addEventListener("click", () => {
  meaningMode = !meaningMode;
  localStorage.setItem("waqtQuranBn", meaningMode ? "1" : "0");
  syncMeaningUI();
});

/* ---------- audio (EveryAyah, Mishary Alafasy, verse by verse) ---------- */
const player = $("player");
let playing = false, playPos = null;   // {s, a}
const ayahUrl = (s, a) => "https://everyayah.com/data/Alafasy_128kbps/" +
  String(s).padStart(3,"0") + String(a).padStart(3,"0") + ".mp3";
function pageOfAyahInLoaded(s, a){
  for (const k in packs) for (const p in packs[k].pages)
    if (packs[k].pages[p].some(x => x.s === s && x.a === a)) return Number(p);
  return null;
}
async function ensureAyahVisible(s, a){
  let p = pageOfAyahInLoaded(s, a);
  if (p === null){
    let probe = cur;
    while (p === null && probe < TOTAL){
      probe++;
      const ayahs = await pageAyahs(probe);
      if (ayahs.some(x => x.s === s && x.a === a)) p = probe;
    }
  }
  if (p !== null && p !== cur) await flipTo(p, p > cur ? 1 : -1);
  document.querySelectorAll(".ayah.playing").forEach(el => el.classList.remove("playing"));
  const el = document.querySelector(`.ayah[data-s="${s}"][data-a="${a}"]`);
  if (el){ el.classList.add("playing"); }
  if (meaningMode && $("meaningCard").classList.contains("open")) showMeaning(s, a);
}
async function playAyah(s, a){
  playPos = {s, a};
  player.src = ayahUrl(s, a);
  try { await player.play(); } catch(e) { setPlayUI(false); return; }
  setPlayUI(true);
  const m = surahMeta(s);
  $("playStatus").style.display = "block";
  $("playStatus").textContent = `তিলাওয়াত চলছে · সূরা ${m.en} · আয়াত ${bnD(a)}`;
  ensureAyahVisible(s, a);
}
function setPlayUI(on){
  playing = on;
  $("playBtn").textContent = on ? "⏸ থামান" : "▶ তিলাওয়াত";
  if (!on) $("playStatus").style.display = "none";
}
player.addEventListener("ended", async () => {
  if (!playPos) return;
  let {s, a} = playPos;
  if (a < surahMeta(s).ayahs) a++;
  else if (s < 114) { s++; a = 1; }
  else { setPlayUI(false); playPos = null; return; }
  playAyah(s, a);
});
player.addEventListener("error", () => { if (playing) setPlayUI(false); });
$("playBtn").addEventListener("click", async () => {
  if (playing){ player.pause(); setPlayUI(false); return; }
  if (playPos && player.src){ try { await player.play(); setPlayUI(true); } catch(e){} return; }
  const ayahs = await pageAyahs(cur);
  if (ayahs.length) playAyah(ayahs[0].s, ayahs[0].a);
});

/* ---------- surah index overlay ---------- */
function buildIndex(filter){
  const q = (filter || "").trim().toLowerCase();
  let html = "";
  for (const m of INDEX.surahs){
    if (q && !(m.en.toLowerCase().includes(q) || String(m.n) === q || m.tr.toLowerCase().includes(q))) continue;
    html += `<button class="surah-row" data-page="${m.page}">
      <span class="no">${bnD(m.n)}</span>
      <span class="nm"><b>${m.en}</b><span>${bnD(m.ayahs)} আয়াত · ${m.type === "Meccan" ? "মক্কী" : "মাদানী"} · পৃষ্ঠা ${bnD(m.page)}</span></span>
      <span class="arnm">${m.ar}</span></button>`;
  }
  $("surahList").innerHTML = html || `<p style="padding:18px;color:#6b7a72">কিছু পাওয়া যায়নি</p>`;
  $("surahList").querySelectorAll(".surah-row").forEach(b =>
    b.addEventListener("click", () => { $("indexOverlay").classList.remove("open"); flipTo(Number(b.dataset.page), Number(b.dataset.page) > cur ? 1 : -1); }));
}
$("openIndex").addEventListener("click", () => { buildIndex(""); $("indexOverlay").classList.add("open"); });
$("surahSearch").addEventListener("input", e => buildIndex(e.target.value));

/* ---------- page jump overlay ---------- */
$("pgNum").addEventListener("click", () => { $("jumpOverlay").classList.add("open"); $("jumpInput").value = ""; });
$("jumpGo").addEventListener("click", () => {
  const v = Number($("jumpInput").value);
  if (v >= 1 && v <= TOTAL){ $("jumpOverlay").classList.remove("open"); flipTo(v, v > cur ? 1 : -1); }
});
document.querySelectorAll("[data-close]").forEach(b =>
  b.addEventListener("click", () => $(b.dataset.close).classList.remove("open")));
document.querySelectorAll(".overlay").forEach(ov =>
  ov.addEventListener("click", e => { if (e.target === ov) ov.classList.remove("open"); }));

/* ---------- keep pages fitted when the screen size changes ---------- */
let rszT = null;
window.addEventListener("resize", () => {
  clearTimeout(rszT);
  rszT = setTimeout(() => { for (const k in fitCache) delete fitCache[k]; if (!flipping && INDEX) render(cur); }, 250);
});

/* ---------- init ---------- */
(async function init(){
  try {
    const r = await fetch("quran/quran_index.json");
    INDEX = await r.json();
    const p0 = await loadPack(0);
    BISM = p0.pages["1"][0].ar;   // canonical bismillah, taken from the data itself
    const saved = Number(localStorage.getItem("waqtQuranPage") || 1);
    cur = (saved >= 1 && saved <= TOTAL) ? saved : 1;
    syncMeaningUI();
    await render(cur);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
      for (const k in fitCache) delete fitCache[k];
      if (!flipping) render(cur);
    });
    const nk = packOf(cur + 1); if (nk <= 30) loadPack(nk).catch(()=>{});
  } catch(e) {
    $("pageScroll").innerHTML = `<p style="padding:24px;text-align:center">দুঃখিত, কুরআনের তথ্য আনা যায়নি। ইন্টারনেট সংযোগ দেখে আবার চেষ্টা করুন।</p>`;
  }
  if ("serviceWorker" in navigator && /github\.io$/.test(location.hostname))
    navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
