<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>পবিত্র কুরআন — Waqt (ওয়াক্ত)</title>
<meta name="description" content="Waqt (ওয়াক্ত) — পবিত্র কুরআন: আসল মুসহাফের ৬০৪ পাতা, আরবি লেখা, মুহিউদ্দীন খানের বাংলা অর্থ ও মিশারি আল-আফাসির তিলাওয়াত। পাতা উল্টে পড়ুন, শুনুন।">
<meta name="theme-color" content="#0b5c4d">
<link rel="icon" type="image/png" href="logo.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --emerald:#0b5c4d; --emerald-deep:#073f34; --gold:#c9a227; --gold-soft:#e7cf7a;
  --paper:#fffdf4; --paper2:#faf2da; --ink:#22302a; --muted:#6b7a72;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Hind Siliguri',sans-serif;background:#0a3d31;color:var(--ink);overflow-x:hidden;
  background-image:radial-gradient(ellipse at 50% -10%,#11634f 0%,#0a3d31 55%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:10px 12px;background:linear-gradient(180deg,rgba(7,50,40,.97),rgba(7,50,40,.92));
  backdrop-filter:blur(6px);border-bottom:1px solid rgba(201,162,39,.35)}
header .back{display:flex;align-items:center;gap:6px;color:#eafaf3;font-size:15px;font-weight:600;
  padding:9px 12px;border:1px solid rgba(231,207,122,.45);border-radius:999px;min-height:44px;text-decoration:none}
header .ttl{flex:1;text-align:center;color:#fff}
header .ttl b{display:block;font-size:19px;line-height:1.15}
header .ttl span{font-size:12px;color:var(--gold-soft)}
header .idxbtn{color:#073f34;background:linear-gradient(180deg,var(--gold-soft),var(--gold));
  font-weight:700;font-size:14px;padding:10px 14px;border-radius:999px;min-height:44px}
main{max-width:760px;margin:0 auto;padding:12px 10px 8px}
#book{position:relative;height:calc(100dvh - 232px);min-height:340px;perspective:1900px}
.page,.sheet{position:absolute;inset:0;border-radius:8px}
.page{background:linear-gradient(160deg,var(--paper) 0%,var(--paper2) 100%);
  border:1px solid #d9c68d;box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 0 60px rgba(201,162,39,.08);
  overflow:hidden}
.page::before{content:"";position:absolute;inset:7px;border:1.5px solid rgba(201,162,39,.55);
  border-radius:5px;pointer-events:none;z-index:3}
.page::after{content:"";position:absolute;inset:11px;border:.75px solid rgba(201,162,39,.35);
  border-radius:4px;pointer-events:none;z-index:3}
.page-scroll{position:absolute;inset:0;overflow-y:auto;padding:22px 20px 16px;scrollbar-width:thin}
.sheet{z-index:6;transform-style:preserve-3d;pointer-events:none;display:none}
.sheet .face{position:absolute;inset:0;border-radius:8px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:linear-gradient(160deg,var(--paper),var(--paper2));border:1px solid #d9c68d;
  box-shadow:0 18px 40px rgba(0,0,0,.45)}
.sheet .face::before{content:"";position:absolute;inset:7px;border:1.5px solid rgba(201,162,39,.55);border-radius:5px;pointer-events:none;z-index:3}
.sheet .face.back{transform:rotateY(180deg);
  background:linear-gradient(250deg,#f6ecd2,#efe3c2)}
.sheet.anim{transition:transform .58s cubic-bezier(.35,.65,.3,1)}
#loading{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;
  color:var(--emerald);font-weight:600;font-size:16px;background:rgba(255,253,244,.85);border-radius:8px}
.ar-block{direction:rtl;text-align:justify;font-family:'Amiri Quran',serif;
  font-size:27px;line-height:2.2;color:#1c2a24}
.ar-block .ayah{border-radius:6px;padding:0 1px}
.ar-block .ayah.playing{background:rgba(201,162,39,.28);box-shadow:0 0 0 2px rgba(201,162,39,.25)}
.marker{color:#a87f14;font-size:.68em;white-space:nowrap;padding:0 2px}
.surah-head{margin:6px 0 10px;padding:9px 12px;border-radius:8px;text-align:center;
  background:linear-gradient(180deg,#0e6a55,#0b5c4d);border:1px solid var(--gold);
  box-shadow:inset 0 0 0 3px rgba(231,207,122,.25)}
.surah-head .sh-ar{display:block;font-family:'Amiri Quran',serif;font-size:25px;color:#f3d98b;line-height:1.5}
.surah-head .sh-meta{display:block;font-size:12.5px;color:#dff5ea;margin-top:1px}
.bismillah{direction:rtl;text-align:center;font-family:'Amiri Quran',serif;
  font-size:26px;line-height:1.9;color:#0b5c4d;margin:2px 0 8px}
.page-foot{margin-top:14px;padding-top:8px;border-top:1px solid rgba(201,162,39,.4);
  display:flex;justify-content:space-between;align-items:center;color:#8a6d1f;font-size:13px;font-weight:600}
.page-foot .wm{letter-spacing:.14em;font-size:11px;color:#b08d28}
.tr-block{margin-top:14px;border-top:1px dashed rgba(11,92,77,.35);padding-top:10px}
.tr{margin-bottom:10px}
.tr b{color:var(--emerald);font-size:13px}
.tr .bn{display:block;font-size:15.5px;line-height:1.75;color:#2c3a33}
.tr .en{display:block;font-size:13px;line-height:1.6;color:var(--muted);margin-top:1px}
#meta{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;color:#eafaf3;font-size:14.5px}
#meta .pgnum{font-weight:700;color:#fff;cursor:pointer;padding:6px 10px;border-radius:8px;border:1px dashed rgba(231,207,122,.5)}
#playStatus{display:none;text-align:center;color:var(--gold-soft);font-size:13.5px;margin-top:6px;min-height:18px}
#controls{position:sticky;bottom:0;z-index:30;max-width:760px;margin:8px auto 0;
  display:flex;gap:8px;padding:10px;background:linear-gradient(180deg,rgba(7,50,40,.92),rgba(7,50,40,.98));
  border-top:1px solid rgba(201,162,39,.35);backdrop-filter:blur(6px)}
#controls button{flex:1;min-height:50px;border-radius:12px;font-size:15.5px;font-weight:700;
  color:#eafaf3;border:1px solid rgba(231,207,122,.4);background:rgba(255,255,255,.06)}
#controls button:active{transform:scale(.97)}
#controls #playBtn{background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:#3a2c00;border:none}
#controls #bnBtn.on{background:#11634f;border-color:var(--gold-soft);color:#fff}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(4,30,24,.72);display:none;
  align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet-panel{background:var(--paper);width:100%;max-width:760px;max-height:86dvh;border-radius:18px 18px 0 0;
  display:flex;flex-direction:column;overflow:hidden;animation:up .25s ease}
@keyframes up{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
.sheet-panel .p-head{padding:14px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #eadfae}
.sheet-panel .p-head b{flex:1;font-size:17px;color:var(--emerald)}
.sheet-panel .p-head .x{font-size:20px;padding:8px 12px;border-radius:10px;background:#f1e8c8;min-height:44px;min-width:44px}
.sheet-panel .p-search{padding:10px 16px;border-bottom:1px solid #f0e6bd}
.sheet-panel .p-search input{width:100%;padding:12px 14px;font-size:16px;font-family:inherit;
  border:1.5px solid #d9c68d;border-radius:12px;background:#fffef9}
.surah-list{overflow-y:auto;padding:6px 8px 14px}
.surah-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 10px;
  border-radius:12px;min-height:56px}
.surah-row:active{background:#f4ecd0}
.surah-row .no{width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--gold);border-radius:50%;color:#8a6d1f;font-weight:700;font-size:14px;background:#fffbe9}
.surah-row .nm{flex:1}
.surah-row .nm b{display:block;font-size:16px;color:#22302a}
.surah-row .nm span{font-size:12.5px;color:var(--muted)}
.surah-row .arnm{font-family:'Amiri Quran',serif;font-size:21px;color:var(--emerald)}
.jump-body{padding:18px 16px 22px;text-align:center}
.jump-body input{width:130px;padding:12px;font-size:20px;text-align:center;font-family:inherit;
  border:1.5px solid #d9c68d;border-radius:12px;background:#fffef9}
.jump-body .go{margin-left:8px;padding:12px 22px;font-size:16px;font-weight:700;border-radius:12px;
  background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:#3a2c00;min-height:50px}
.jump-body p{color:var(--muted);font-size:13.5px;margin-top:10px}
@media (min-width:640px){ .ar-block{font-size:30px} #book{height:calc(100dvh - 240px)} }
</style>
</head>
<body>
<header>
  <a class="back" href="index.html">‹ Waqt হোম</a>
  <div class="ttl"><b>পবিত্র কুরআন</b><span>আল-কুরআনুল কারীম · মুসহাফ</span></div>
  <button class="idxbtn" id="openIndex">সূরা তালিকা</button>
</header>
<main>
  <div id="book">
    <div class="page" id="pageBase"><div class="page-scroll" id="pageScroll"></div></div>
    <div class="sheet" id="sheet"><div class="face front" id="sheetFront"></div><div class="face back"></div></div>
    <div id="loading">পৃষ্ঠা আনা হচ্ছে…</div>
  </div>
  <div id="meta"><span>পৃষ্ঠা</span><span class="pgnum" id="pgNum">১</span><span>/ ৬০৪</span><span id="juzLbl"></span></div>
  <div id="playStatus"></div>
</main>
<div id="controls">
  <button id="prevBtn">‹ আগের পাতা</button>
  <button id="playBtn">▶ তিলাওয়াত</button>
  <button id="bnBtn">অর্থ</button>
  <button id="nextBtn">পরের পাতা ›</button>
</div>

<div class="overlay" id="indexOverlay">
  <div class="sheet-panel">
    <div class="p-head"><b>সূরার তালিকা</b><button class="x" data-close="indexOverlay">✕</button></div>
    <div class="p-search"><input id="surahSearch" type="text" placeholder="সূরার নাম বা নম্বর লিখুন — যেমন: Yaseen, 36"></div>
    <div class="surah-list" id="surahList"></div>
  </div>
</div>

<div class="overlay" id="jumpOverlay">
  <div class="sheet-panel">
    <div class="p-head"><b>পৃষ্ঠায় যান</b><button class="x" data-close="jumpOverlay">✕</button></div>
    <div class="jump-body">
      <input id="jumpInput" type="number" min="1" max="604" inputmode="numeric" placeholder="1–604">
      <button class="go" id="jumpGo">যান</button>
      <p>মুসহাফের পৃষ্ঠা নম্বর দিন (১ থেকে ৬০৪)</p>
    </div>
  </div>
</div>

<audio id="player" preload="auto"></audio>

<script>
"use strict";
const TOTAL = 604, PACK = 20;
const bnD = s => String(s).replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]);
const arD = s => String(s).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const $ = id => document.getElementById(id);
let INDEX = null, BISM = "";
const packs = {};               // packNo -> {pages:{...}}
let cur = 1;                    // current page
let showBn = localStorage.getItem("waqtQuranBn") === "1";
let flipping = false;

/* ---------- data ---------- */
async function loadPack(k){
  if (packs[k]) return packs[k];
  const r = await fetch("quran/pack" + String(k).padStart(2,"0") + ".json");
  if (!r.ok) throw new Error("pack " + k + " HTTP " + r.status);
  packs[k] = await r.json();
  return packs[k];
}
const packOf = page => Math.floor((page - 1) / PACK);
async function pageAyahs(page){
  const p = await loadPack(packOf(page));
  return p.pages[String(page)] || [];
}
function surahMeta(n){ return INDEX.surahs[n - 1]; }

/* ---------- rendering ---------- */
function pageHTML(ayahs, pageNo){
  let ar = "", lastSurah = 0;
  for (const a of ayahs){
    if (a.a === 1 && a.s !== lastSurah){
      const m = surahMeta(a.s);
      ar += `</p><div class="surah-head"><span class="sh-ar">${m.ar}</span>` +
            `<span class="sh-meta">সূরা ${bnD(m.n)} · ${bnD(m.ayahs)} আয়াত · ${m.type === "Meccan" ? "মক্কী" : "মাদানী"}</span></div>`;
      if (m.bism && a.s !== 1) ar += `<div class="bismillah">${BISM}</div>`;
      ar += `<p class="ar-block">`;
      lastSurah = a.s;
    }
    ar += `<span class="ayah" data-s="${a.s}" data-a="${a.a}">${a.ar}<span class="marker">۝${arD(a.a)}</span></span> `;
  }
  let html = `<p class="ar-block">${ar}</p>`;
  // the surah-head insertion above closes/reopens the paragraph; clean the first empty one
  html = html.replace('<p class="ar-block"></p>', '');
  if (showBn){
    let tr = `<div class="tr-block">`;
    for (const a of ayahs){
      tr += `<div class="tr"><b>${bnD(a.s)}:${bnD(a.a)}</b>` +
            `<span class="bn">${a.bn}</span><span class="en">${a.en}</span></div>`;
    }
    html += tr + `</div>`;
  }
  const juz = ayahs.length ? ayahs[0].j : "";
  html += `<div class="page-foot"><span>পারা ${bnD(juz)}</span><span class="wm">WAQT</span><span>পৃষ্ঠা ${bnD(pageNo)}</span></div>`;
  return html;
}
async function render(page){
  const ayahs = await pageAyahs(page);
  $("pageScroll").innerHTML = pageHTML(ayahs, page);
  $("pageScroll").scrollTop = 0;
  $("pgNum").textContent = bnD(page);
  $("juzLbl").textContent = ayahs.length ? "· পারা " + bnD(ayahs[0].j) : "";
  localStorage.setItem("waqtQuranPage", String(page));
}

/* ---------- page flip ---------- */
async function flipTo(target, dir){
  let guard = 0;
  while (flipping && guard++ < 15) await new Promise(r => setTimeout(r, 60));
  if (flipping || target === cur || target < 1 || target > TOTAL) return;
  flipping = true;
  const need = packOf(target);
  if (!packs[need]){ $("loading").style.display = "flex"; await loadPack(need).catch(()=>{}); $("loading").style.display = "none"; }
  const tAyahs = await pageAyahs(target);
  const tHTML = `<div class="page-scroll">${pageHTML(tAyahs, target)}</div>`;
  const cHTML = `<div class="page-scroll">${$("pageScroll").innerHTML}</div>`;
  const sheet = $("sheet"), front = $("sheetFront");
  sheet.style.display = "block";
  sheet.classList.remove("anim");
  if (dir > 0){           // next: current page sheet turns away to the left
    front.innerHTML = cHTML;
    sheet.style.transformOrigin = "left center";
    sheet.style.transform = "rotateY(0deg)";
    $("pageScroll").innerHTML = pageHTML(tAyahs, target);
    $("pageScroll").scrollTop = 0;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      sheet.classList.add("anim"); sheet.style.transform = "rotateY(-180deg)";
    }));
  } else {               // prev: previous page sheet sweeps in from the left
    front.innerHTML = tHTML;
    sheet.style.transformOrigin = "left center";
    sheet.style.transform = "rotateY(-180deg)";
    requestAnimationFrame(() => requestAnimationFrame(() => {
      sheet.classList.add("anim"); sheet.style.transform = "rotateY(0deg)";
    }));
    setTimeout(() => { $("pageScroll").innerHTML = pageHTML(tAyahs, target); $("pageScroll").scrollTop = 0; }, 590);
  }
  cur = target;
  $("pgNum").textContent = bnD(target);
  $("juzLbl").textContent = tAyahs.length ? "· পারা " + bnD(tAyahs[0].j) : "";
  localStorage.setItem("waqtQuranPage", String(target));
  setTimeout(() => { sheet.style.display = "none"; sheet.classList.remove("anim"); flipping = false; }, 640);
  const nk = packOf(target + (dir > 0 ? 1 : -1));
  if (nk >= 0 && nk <= 30 && !packs[nk]) loadPack(nk).catch(()=>{});
}
const nextPage = () => flipTo(cur + 1, 1);
const prevPage = () => flipTo(cur - 1, -1);

/* touch swipe + edge taps */
let tx = 0, ty = 0;
$("book").addEventListener("touchstart", e => { const t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; }, {passive:true});
$("book").addEventListener("touchend", e => {
  const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4){ dx < 0 ? nextPage() : prevPage(); }
}, {passive:true});
$("book").addEventListener("click", e => {
  if (window.getSelection && String(window.getSelection())) return;
  const r = $("book").getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
  if (x < 0.16) prevPage(); else if (x > 0.84) nextPage();
});
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") nextPage();
  if (e.key === "ArrowRight") prevPage();
});
$("nextBtn").addEventListener("click", nextPage);
$("prevBtn").addEventListener("click", prevPage);

/* ---------- translation toggle ---------- */
function syncBnBtn(){ $("bnBtn").classList.toggle("on", showBn); $("bnBtn").textContent = showBn ? "অর্থ ✓" : "অর্থ"; }
$("bnBtn").addEventListener("click", async () => {
  showBn = !showBn;
  localStorage.setItem("waqtQuranBn", showBn ? "1" : "0");
  syncBnBtn(); render(cur);
});

/* ---------- audio (EveryAyah, Mishary Alafasy, verse by verse) ---------- */
const player = $("player");
let playing = false, playPos = null;   // {s, a}
const ayahUrl = (s, a) => "https://everyayah.com/data/Alafasy_128kbps/" +
  String(s).padStart(3,"0") + String(a).padStart(3,"0") + ".mp3";
function pageOfAyahInLoaded(s, a){
  for (const k in packs) for (const p in packs[k].pages)
    if (packs[k].pages[p].some(x => x.s === s && x.a === a)) return Number(p);
  return null;
}
async function ensureAyahVisible(s, a){
  let p = pageOfAyahInLoaded(s, a);
  if (p === null){
    // sequential reading: the ayah is on the next not-yet-loaded page(s)
    let probe = cur;
    while (p === null && probe < TOTAL){
      probe++;
      const ayahs = await pageAyahs(probe);
      if (ayahs.some(x => x.s === s && x.a === a)) p = probe;
    }
  }
  if (p !== null && p !== cur) await flipTo(p, p > cur ? 1 : -1);
  document.querySelectorAll(".ayah.playing").forEach(el => el.classList.remove("playing"));
  const el = document.querySelector(`.ayah[data-s="${s}"][data-a="${a}"]`);
  if (el){ el.classList.add("playing"); el.scrollIntoView({block:"nearest", behavior:"smooth"}); }
}
async function playAyah(s, a){
  playPos = {s, a};
  player.src = ayahUrl(s, a);
  try { await player.play(); } catch(e) { setPlayUI(false); return; }
  setPlayUI(true);
  const m = surahMeta(s);
  $("playStatus").style.display = "block";
  $("playStatus").textContent = `তিলাওয়াত চলছে · সূরা ${m.en} · আয়াত ${bnD(a)}`;
  ensureAyahVisible(s, a);
}
function setPlayUI(on){
  playing = on;
  $("playBtn").textContent = on ? "⏸ থামান" : "▶ তিলাওয়াত";
  if (!on) $("playStatus").style.display = "none";
}
player.addEventListener("ended", async () => {
  if (!playPos) return;
  let {s, a} = playPos;
  if (a < surahMeta(s).ayahs) a++;
  else if (s < 114) { s++; a = 1; }
  else { setPlayUI(false); playPos = null; return; }
  playAyah(s, a);
});
player.addEventListener("error", () => { if (playing) setPlayUI(false); });
$("playBtn").addEventListener("click", async () => {
  if (playing){ player.pause(); setPlayUI(false); return; }
  if (playPos && player.src){ try { await player.play(); setPlayUI(true); } catch(e){} return; }
  const ayahs = await pageAyahs(cur);
  if (ayahs.length) playAyah(ayahs[0].s, ayahs[0].a);
});

/* ---------- surah index overlay ---------- */
function buildIndex(filter){
  const q = (filter || "").trim().toLowerCase();
  let html = "";
  for (const m of INDEX.surahs){
    if (q && !(m.en.toLowerCase().includes(q) || String(m.n) === q || m.tr.toLowerCase().includes(q))) continue;
    html += `<button class="surah-row" data-page="${m.page}">
      <span class="no">${bnD(m.n)}</span>
      <span class="nm"><b>${m.en}</b><span>${bnD(m.ayahs)} আয়াত · ${m.type === "Meccan" ? "মক্কী" : "মাদানী"} · পৃষ্ঠা ${bnD(m.page)}</span></span>
      <span class="arnm">${m.ar}</span></button>`;
  }
  $("surahList").innerHTML = html || `<p style="padding:18px;color:#6b7a72">কিছু পাওয়া যায়নি</p>`;
  $("surahList").querySelectorAll(".surah-row").forEach(b =>
    b.addEventListener("click", () => { $("indexOverlay").classList.remove("open"); flipTo(Number(b.dataset.page), 1); }));
}
$("openIndex").addEventListener("click", () => { buildIndex(""); $("indexOverlay").classList.add("open"); });
$("surahSearch").addEventListener("input", e => buildIndex(e.target.value));

/* ---------- page jump overlay ---------- */
$("pgNum").addEventListener("click", () => { $("jumpOverlay").classList.add("open"); $("jumpInput").value = ""; });
$("jumpGo").addEventListener("click", () => {
  const v = Number($("jumpInput").value);
  if (v >= 1 && v <= TOTAL){ $("jumpOverlay").classList.remove("open"); flipTo(v, v > cur ? 1 : -1); }
});
document.querySelectorAll("[data-close]").forEach(b =>
  b.addEventListener("click", () => $(b.dataset.close).classList.remove("open")));
document.querySelectorAll(".overlay").forEach(ov =>
  ov.addEventListener("click", e => { if (e.target === ov) ov.classList.remove("open"); }));

/* ---------- init ---------- */
(async function init(){
  try {
    const r = await fetch("quran/quran_index.json");
    INDEX = await r.json();
    const p0 = await loadPack(0);
    BISM = p0.pages["1"][0].ar;   // canonical bismillah, taken from the data itself
    const saved = Number(localStorage.getItem("waqtQuranPage") || 1);
    cur = (saved >= 1 && saved <= TOTAL) ? saved : 1;
    syncBnBtn();
    await render(cur);
    const nk = packOf(cur + 1); if (nk <= 30) loadPack(nk).catch(()=>{});
  } catch(e) {
    $("pageScroll").innerHTML = `<p style="padding:24px;text-align:center">দুঃখিত, কুরআনের তথ্য আনা যায়নি। ইন্টারনেট সংযোগ দেখে আবার চেষ্টা করুন।</p>`;
  }
  if ("serviceWorker" in navigator && /github\.io$/.test(location.hostname))
    navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
